name: Sync devices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  issues:
    types:
      - opened

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-devices
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'sync-devices')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Prefer PAT so the opened PR can trigger validate/generate workflows.
          # Fall back to github.token when SYNC_DEVICES_TOKEN is unset.
          token: ${{ secrets.SYNC_DEVICES_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update devices
        run: pnpm update:devices

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Detected the following changes:"
            git status --porcelain
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No device metadata changes"
          fi

      - name: Build Pull Request body
        if: steps.diff.outputs.has_changes == 'true'
        id: pr-body
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "body<<EOF"
            echo "## Summary"
            echo ""
            echo "この Pull Request は GitHub Actions の Sync devices workflow によって自動生成されました。"
            echo ""
            echo "- 実行コマンド: \`pnpm update:devices\`"
            echo "- 変更元: upstream（\`partslist.csv\` / chirimen-drivers）由来の更新です"
            echo "- 主な変更ファイル: この PR の Files changed を参照してください"
            echo "- merge 前に内容を確認してください（\`main\` への直接反映は行いません）"
            echo ""
            echo "## Related issues"
            echo ""
            echo "- Parent: #47"
            echo "- Related: #50"
            if [ "$EVENT_NAME" = "issues" ] && [ -n "$ISSUE_NUMBER" ]; then
              echo ""
              echo "Closes #${ISSUE_NUMBER}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.SYNC_DEVICES_TOKEN || github.token }}
          branch: chore/update-certified-devices
          title: "chore(devices): sync certified device metadata"
          commit-message: "chore(devices): sync certified device metadata"
          body: ${{ steps.pr-body.outputs.body }}

      - name: Close issue when no changes
        if: github.event_name == 'issues' && steps.diff.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_DEVICES_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT=$(printf '%s\n' \
            '同期処理を実行しましたが、upstream との差分はありませんでした。' \
            '' \
            'このため Pull Request は作成していません。')
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER" --reason completed
