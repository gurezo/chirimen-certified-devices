packages:
  - "."

# 明示設定時は strict がデフォルト true のため、lockfile 再生成時に exclude が自動追記される
minimumReleaseAgeStrict: false

minimumReleaseAgeExclude:
  # 公開から 7 日未満の依存も許可 (ツールチェーン向け)
  - "@eslint/*"
  - "@oxc-project/*"
  - "@rolldown/*"
  - "@types/*"
  - "@typescript-eslint/*"
  - "@vitest/*"
  - brace-expansion
  - es-module-lexer
  - eslint
  - picomatch
  - postcss
  - rolldown
  - typescript
  - typescript-eslint
  - vite
  - vitest

# 悪意のあるリリースは1週間以内に発見され、レジストリから削除される為
# config = 7 day x 24h x 60 min
minimumReleaseAge: 10080
