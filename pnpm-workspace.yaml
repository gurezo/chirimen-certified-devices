packages:
  - "."

# 明示設定時は strict がデフォルト true のため、lockfile 再生成時に exclude が自動追記される
minimumReleaseAgeStrict: false

minimumReleaseAgeExclude:
  # ツールチェーン向け (devDependencies および主要な scoped パッケージ)
  - "@commitlint/*"
  - "@eslint/*"
  - "@oxc-project/*"
  - "@rolldown/*"
  - "@types/*"
  - "@typescript-eslint/*"
  - "@vitest/*"
  - ajv
  - es-module-lexer
  - esbuild
  - eslint
  - husky
  - picomatch
  - rolldown
  - tsx
  - typescript
  - typescript-eslint
  - vite
  - vitest
  - yaml

# 悪意のあるリリースは1週間以内に発見され、レジストリから削除される為
# config = 7 day x 24h x 60 min
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
